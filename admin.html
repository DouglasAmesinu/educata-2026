<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Educata 2026 admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preload" href="assets/fonts/montserrat-latin-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/brand.css">
<style>
  /* Colours and fonts come from assets/brand.css. */
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--text);font:500 15px/1.5 var(--font-body)}
  .top{background:var(--black);color:var(--white);display:flex;align-items:center;gap:18px;padding:14px 24px}
  .top img{width:120px;height:auto;display:block}
  .top h1{font:800 24px/1 var(--font-head);margin:0;padding-left:18px;border-left:2px solid var(--muted)}
  main{max-width:1180px;margin:0 auto;padding:20px 16px 80px}
  h2{font:800 20px/1.2 var(--font-head);margin:40px 0 10px;padding-bottom:8px;border-bottom:4px solid var(--orange);display:inline-block}
  .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
  button,input{font:inherit}
  button{min-height:40px;padding:8px 14px;border:2px solid var(--black);border-radius:8px;background:var(--white);color:var(--black);font-weight:600;cursor:pointer}
  button:hover{background:var(--page)}
  button.pri{background:var(--orange);color:var(--black)}
  button.pri:hover{background:var(--orange);box-shadow:0 3px 0 var(--black)}
  button.danger{background:var(--bad);border-color:var(--bad);color:var(--white);margin-left:14px}
  button.danger:hover{background:var(--bad);box-shadow:0 3px 0 var(--black)}
  input[type=text],input[type=email],input[type=password],input[type=search]{min-height:40px;padding:8px 12px;border:2px solid var(--grey-300);border-radius:8px;min-width:220px;background:var(--white);color:var(--text)}
  #q{min-width:min(420px,100%)}
  button:focus-visible,input:focus-visible{outline:3px solid var(--black);outline-offset:2px;border-color:var(--orange)}
  table{width:100%;border-collapse:collapse;background:var(--white);border:1px solid var(--grey-300)}
  th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--grey-300);vertical-align:middle}
  th{background:var(--grey-300);color:var(--black);font-weight:700;white-space:nowrap}
  tbody tr:hover{background:var(--page)}
  td button{margin:2px 0}
  /* Invite link with its Copy button, and each row's actions, stay on one line. */
  #groups td:nth-child(4),#groups td:nth-child(5){white-space:nowrap}
  #groups td:nth-child(4) input{min-width:0;width:230px;margin-right:6px}
  #groups td:first-child{min-width:150px}
  #regs td:first-child{font-family:var(--font-mono);letter-spacing:var(--ref-spacing);white-space:nowrap}
  #regs td:nth-child(3){overflow-wrap:anywhere;min-width:160px}
  .closed{color:var(--muted);font-weight:700}
  .wrap{overflow-x:auto}
  .full{color:var(--bad);font-weight:700} .ok{color:var(--ok);font-weight:700}
  .msg{padding:12px 14px;border-left:6px solid var(--black);background:var(--white);margin:12px 0}
  .msg.bad{border-color:var(--bad)}
  .hidden{display:none}
  code{background:var(--white);border:1px solid var(--grey-300);padding:1px 5px;border-radius:4px}
  @media (max-width:700px){.top{padding:12px 16px}.top img{width:96px}main{padding:16px 12px 60px}
    /* Phones: tables still scroll sideways, with a thin visible scrollbar, a hint line and the first column held in place. */
    .wrap{scrollbar-width:thin;scrollbar-color:var(--muted) var(--grey-300)}
    table{border-collapse:separate;border-spacing:0}
    .wrap::after{content:"Scroll sideways for more columns \2192";position:sticky;left:0;display:block;padding:6px 2px 0;font-size:13px;color:var(--muted)}
    #groups th:first-child,#groups td:first-child,#regs th:first-child,#regs td:first-child{position:sticky;left:0;z-index:1;background:var(--white);box-shadow:2px 0 0 var(--grey-300)}
    #groups th:first-child,#regs th:first-child{background:var(--grey-300)}
    #groups td:first-child{min-width:120px;max-width:150px}}
</style>
</head>
<body>
<header class="top"><img src="assets/educata-logo-light.png" alt="educataGhana" width="120" height="41"><h1>Admin</h1></header>
<main>
  <div id="msg" class="msg hidden" role="status"></div>

  <section id="login">
    <div class="bar">
      <input type="email" id="em" placeholder="Admin email" autocomplete="username">
      <input type="password" id="pw" placeholder="Password" autocomplete="current-password">
      <button class="pri" id="signin">Sign in</button>
    </div>
  </section>

  <section id="app" class="hidden">
    <div class="bar"><span id="who"></span><button id="signout">Sign out</button></div>

    <div id="seedbox" class="msg hidden">
      No seat groups exist yet.
      <button class="pri" id="seed">Create the 22 seat groups and invite codes</button>
    </div>

    <h2>Seat groups and invite links</h2>
    <div class="bar"><span id="totals"></span><button id="recon">Recount seats from registrations</button><button id="addgroup">Add group</button></div>
    <div class="wrap"><table id="groups"><thead><tr><th>Group</th><th>Seats</th><th>Status</th><th>Invite link</th><th>Actions</th></tr></thead><tbody></tbody></table></div>

    <h2>Registrations</h2>
    <div class="bar">
      <input type="search" id="q" placeholder="Search name, email, organisation, reference">
      <button id="csv">Download CSV</button>
      <span id="regcount"></span>
    </div>
    <div class="wrap"><table id="regs"><thead><tr><th>Reference</th><th>Name</th><th>Email</th><th>Group</th><th>Organisation</th><th>Phone</th><th>Checked in</th><th></th></tr></thead><tbody></tbody></table></div>
  </section>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, writeBatch, runTransaction, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { GROUP_PLAN, makeCode, makeGroupId, cryptoRand, toCSV, inviteLink } from "./core.js";
import { FIREBASE_CONFIG, PUBLIC_BASE_URL } from "./config.js";

const $ = (id) => document.getElementById(id);
const app = initializeApp(FIREBASE_CONFIG);
const auth = getAuth(app);
const db = getFirestore(app);
let groups = [], invites = {}, regs = [], unsubs = [];
const ord = (id) => { const i = GROUP_PLAN.findIndex((p) => p.id === id); return i < 0 ? 1e6 : i; };

function say(text, bad) { const m = $("msg"); m.textContent = text; m.className = "msg" + (bad ? " bad" : ""); }
const el = (tag, text, cls) => { const e = document.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; };
const linkFor = (code) => inviteLink(PUBLIC_BASE_URL, location.href, code);
const hhmm = (ts) => { const d = ts && ts.toDate ? ts.toDate() : ts instanceof Date ? ts : null; return d ? d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : ""; };

$("signin").onclick = async () => {
  try { await signInWithEmailAndPassword(auth, $("em").value.trim(), $("pw").value); }
  catch (e) { say("Sign in failed: " + (e.code || e.message), true); }
};
$("signout").onclick = () => signOut(auth);

onAuthStateChanged(auth, async (user) => {
  if (!user) { unsubs.forEach((u) => u()); unsubs = []; $("login").classList.remove("hidden"); $("app").classList.add("hidden"); return; }
  const a = await getDoc(doc(db, "admins", user.uid)).catch(() => null);
  if (!a || !a.exists()) { say("This account is signed in but is not on the admin list. Ask the owner to add admins/" + user.uid + " in the Firebase console.", true); await signOut(auth); return; }
  $("login").classList.add("hidden"); $("app").classList.remove("hidden"); $("who").textContent = user.email; say("Signed in.");
  setTimeout(() => { if ($("msg").textContent === "Signed in.") $("msg").classList.add("hidden"); }, 3000); // errors stay visible
  if (!unsubs.length) listen();
});

// Live listeners: the first snapshot reads every document once, after that only changed documents are read.
// Nothing reloads the whole list after an action; the listeners redraw the tables.
function listen() {
  const fail = (what) => (e) => say("Live updates for " + what + " stopped: " + (e.code || e.message) + ". Reload the page.", true);
  unsubs = [
    onSnapshot(collection(db, "groups"), (s) => {
      groups = s.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => ord(a.id) - ord(b.id));
      $("seedbox").classList.toggle("hidden", groups.length > 0);
      renderGroups(); renderRegs();
    }, fail("seat groups")),
    onSnapshot(collection(db, "invites"), (s) => { invites = {}; s.docs.forEach((d) => (invites[d.data().gid] = d.id)); renderGroups(); }, fail("invite links")),
    onSnapshot(collection(db, "registrations"), (s) => { regs = s.docs.map((d) => ({ id: d.id, ...d.data() })); renderRegs(); }, fail("registrations")),
  ];
}

$("seed").onclick = async () => {
  if (groups.length) return say("Groups already exist. Seeding refused so codes are not overwritten.", true);
  const b = writeBatch(db); const used = new Set();
  for (const g of GROUP_PLAN) {
    let code; do { code = makeCode(cryptoRand); } while (used.has(code)); used.add(code);
    b.set(doc(db, "groups", g.id), { name: g.name, category: g.category, cap: g.cap, count: 0, open: true, lastReg: "" });
    b.set(doc(db, "invites", code), { gid: g.id });
  }
  try { await b.commit(); say("Created " + GROUP_PLAN.length + " groups."); } catch (e) { say("Seeding failed: " + (e.code || e.message), true); }
};

function renderGroups() {
  const tb = $("groups").tBodies[0]; tb.replaceChildren();
  let taken = 0, cap = 0;
  for (const g of groups) {
    taken += g.count; cap += g.cap;
    const tr = el("tr");
    tr.append(el("td", g.name));
    tr.append(el("td", `${g.count} / ${g.cap}`, g.count >= g.cap ? "full" : ""));
    tr.append(el("td", !g.open ? "Closed by admin" : g.count >= g.cap ? "Full" : "Open", !g.open ? "closed" : g.count >= g.cap ? "full" : "ok"));
    const code = invites[g.id]; const lk = el("td");
    if (code) { const inp = el("input"); inp.type = "text"; inp.readOnly = true; inp.value = linkFor(code); inp.style.minWidth = "260px"; lk.append(inp); const cb = el("button", "Copy"); cb.onclick = async () => { await navigator.clipboard.writeText(inp.value); say("Copied link for " + g.name); }; lk.append(cb); }
    else lk.textContent = "No code";
    tr.append(lk);
    const ac = el("td");
    const tog = el("button", g.open ? "Close" : "Reopen"); tog.onclick = async () => { await updateDoc(doc(db, "groups", g.id), { open: !g.open }); };
    const cp = el("button", "Set cap"); cp.onclick = async () => { const v = parseInt(prompt("New cap for " + g.name + " (currently " + g.cap + "):", g.cap), 10); if (!Number.isInteger(v) || v < g.count || v > 500) return say("Cap must be a whole number from " + g.count + " to 500.", true); await updateDoc(doc(db, "groups", g.id), { cap: v }); };
    const rn = el("button", "Rename"); rn.onclick = async () => { const v = (prompt("Name for this group:", g.name) || "").trim(); if (!v) return; await updateDoc(doc(db, "groups", g.id), { name: v.slice(0, 100) }); };
    const dg = el("button", "Delete", "danger");
    dg.onclick = async () => {
      if (g.count > 0) return say("Cannot delete " + g.name + " while it has " + g.count + " registration(s). Remove them first.", true);
      if (!confirm("Delete group " + g.name + " and its invite link? The link will stop working.")) return;
      const b = writeBatch(db); b.delete(doc(db, "groups", g.id)); if (invites[g.id]) b.delete(doc(db, "invites", invites[g.id]));
      try { await b.commit(); say("Deleted " + g.name); } catch (e) { say("Delete failed: " + (e.code || e.message), true); }
    };
    ac.append(tog, " ", cp, " ", rn, " ", dg); tr.append(ac); tb.append(tr);
  }
  $("totals").textContent = `${taken} registered of ${cap} seats`;
}

function renderRegs() {
  const q = $("q").value.trim().toLowerCase();
  const nameOf = Object.fromEntries(groups.map((g) => [g.id, g.name]));
  const rows = regs.filter((r) => !q || [r.name, r.email, r.org, r.ref].some((v) => (v || "").toLowerCase().includes(q)))
    .sort((a, b) => (a.name || "").localeCompare(b.name || ""));
  $("regcount").textContent = `${rows.length} shown, ${regs.length} total`;
  const tb = $("regs").tBodies[0]; tb.replaceChildren();
  for (const r of rows) {
    const tr = el("tr");
    [r.ref, r.name, r.email, nameOf[r.gid] || r.gid, r.org || "", r.phone || ""].forEach((v) => tr.append(el("td", v)));
    tr.append(el("td", r.checkedIn ? ("Checked in " + hhmm(r.checkedInAt)).trim() : "")); // read-only: check-in happens only on door.html
    const del = el("td"); const db_ = el("button", "Remove", "danger");
    db_.onclick = async () => {
      if (!confirm("Remove " + r.name + " and free their seat?")) return;
      await runTransaction(db, async (tx) => {
        const gRef = doc(db, "groups", r.gid); const g = (await tx.get(gRef)).data();
        tx.delete(doc(db, "registrations", r.id)); tx.update(gRef, { count: Math.max(0, g.count - 1) });
      });
    };
    del.append(db_); tr.append(del); tb.append(tr);
  }
}
$("q").oninput = renderRegs;

$("addgroup").onclick = async () => {
  const name = (prompt("Name of the new group:") || "").trim().slice(0, 100);
  if (!name) return;
  const cap = parseInt(prompt("Number of places for " + name + ":", "10"), 10);
  if (!Number.isInteger(cap) || cap < 1 || cap > 500) return say("Places must be a whole number from 1 to 500.", true);
  const gid = makeGroupId(name, cryptoRand), code = makeCode(cryptoRand);
  const b = writeBatch(db);
  b.set(doc(db, "groups", gid), { name, category: "Custom", cap, count: 0, open: true, lastReg: "" });
  b.set(doc(db, "invites", code), { gid });
  try { await b.commit(); say("Added " + name + ". Copy its link from the table."); } catch (e) { say("Add failed: " + (e.code || e.message), true); }
};

$("recon").onclick = async () => {
  const counts = {}; regs.forEach((r) => (counts[r.gid] = (counts[r.gid] || 0) + 1));
  const b = writeBatch(db); let n = 0;
  for (const g of groups) { const real = counts[g.id] || 0; if (real !== g.count) { b.update(doc(db, "groups", g.id), { count: real }); n++; } }
  if (!n) return say("Seat counts already match registrations.");
  await b.commit(); say("Corrected " + n + " group count(s).");
};

$("csv").onclick = () => {
  const nameOf = Object.fromEntries(groups.map((g) => [g.id, g.name]));
  const rows = regs.map((r) => ({ ref: r.ref, name: r.name, email: r.email, phone: r.phone || "", org: r.org || "", group: nameOf[r.gid] || r.gid, checkedIn: r.checkedIn ? "yes" : "no" }));
  const csv = toCSV(rows, ["ref", "name", "email", "phone", "org", "group", "checkedIn"]);
  const a = el("a"); a.href = URL.createObjectURL(new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8" })); a.download = "educata-2026-registrations.csv"; a.click(); URL.revokeObjectURL(a.href);
};
</script>
</body>
</html>
