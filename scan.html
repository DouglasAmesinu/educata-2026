<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Content Creators Contest scanner</title>
<meta name="robots" content="noindex, nofollow">
<link rel="modulepreload" href="./config.js">
<link rel="modulepreload" href="./core.js">
<link rel="preload" href="assets/fonts/montserrat-latin-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/brand.css">
<style>
  /* Staff phone page. No Firebase, no libraries: one fetch to the scan relay function. Colours and fonts from assets/brand.css. */
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:#000000;color:#FFFFFF;font:500 18px/1.45 var(--font-body,system-ui,sans-serif);display:grid;place-items:center;padding:20px}
  main{width:100%;max-width:440px;text-align:center}
  .logo{display:block;width:110px;height:auto;margin:0 auto 10px}
  h1{font:800 20px/1.2 var(--font-head,system-ui,sans-serif);margin:0 0 18px;color:#EC8223}
  .box{background:#FFFFFF;color:#2A2A2A;border-radius:18px;border-top:4px solid #EC8223;padding:22px;text-align:left}
  .box.sent{background:#1F7A4D;color:#FFFFFF;border-top-color:#1F7A4D;text-align:center}
  .box.dup{background:#B3261E;color:#FFFFFF;border-top-color:#B3261E;text-align:center}
  .big{font:800 28px/1.15 var(--font-head,system-ui,sans-serif);margin:0 0 6px;color:inherit}
  .box.sent .big,.box.dup .big{font-size:36px}
  .ref{font:700 26px/1.1 var(--font-mono,monospace);letter-spacing:var(--ref-spacing,.08em);margin:10px 0;overflow-wrap:anywhere}
  .box.dup #msg{font-weight:800;font-size:22px}
  label{display:block;margin:10px 0 0;font-weight:700}
  input,button{font:inherit;width:100%;min-height:52px;padding:13px;border-radius:11px;border:2px solid #DBDBDB;margin:6px 0}
  input{background:#FFFFFF;color:#2A2A2A}
  #code{font:700 28px/1 var(--font-mono,monospace);letter-spacing:.2em}
  input:focus-visible,button:focus-visible{outline:3px solid #000000;outline-offset:2px;border-color:#EC8223}
  button{background:#EC8223;color:#000000;border-color:#000000;font-weight:700;cursor:pointer}
  button:disabled{opacity:.6}
  .err{color:#B3261E;font-weight:700;margin:6px 0 0}
  .warn{margin:0 0 14px;padding:12px 14px;border-left:6px solid #EC8223;background:#FFFFFF;color:#2A2A2A;border-radius:8px;text-align:left;font-weight:700;font-size:16px}
  .foot{margin:18px 0 0;font-size:15px;color:#DBDBDB;overflow-wrap:anywhere}
  .hidden{display:none!important}
</style>
</head>
<body>
<main>
  <img class="logo" src="assets/educata-logo-light.png" alt="educataGhana" width="110" height="37">
  <h1>Content Creators Contest scanner</h1>
  <p class="warn hidden" id="warn">Open this link in Chrome or Safari so this phone stays set up.</p>
  <div class="box" id="box" role="status" aria-live="polite">
    <p class="big" id="title">Opening...</p>
    <p class="ref hidden" id="ref"></p>
    <p id="msg"></p>
    <form id="setup" class="hidden" novalidate>
      <label for="code">Code from the gate laptop</label>
      <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6 digits">
      <label for="label">Name for this phone</label>
      <input id="label" maxlength="30" placeholder="Gate 1" autocomplete="off">
      <button id="go">Set up this phone</button>
      <p class="err" id="err" role="alert"></p>
    </form>
  </div>
  <p class="foot" id="foot"></p>
</main>
<script type="module">
import { RELAY_URL, ENROLL_URL } from "./config.js";
import { parseRef } from "./core.js";

const KEY = "educata-scan-token", NAME = "educata-scan-label"; // the device token and the phone's name, on this phone only
const $ = (id) => document.getElementById(id);
const hide = (id, h) => $(id).classList.toggle("hidden", h);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
let store = null;
try { localStorage.setItem(KEY + "-test", "1"); localStorage.removeItem(KEY + "-test"); store = localStorage; } catch (e) { /* private mode or blocked */ }
const get = (k) => { try { return store ? store.getItem(k) : null; } catch (e) { return null; } };
const inApp = /FBAN|FBAV|Instagram|WhatsApp|\bLine\/|GSA\//.test(navigator.userAgent);
hide("warn", !!store && !inApp);
let token = get(KEY);
const label = get(NAME);

// kind: "" (white), "sent" (green), "dup" (red). Everything is text (textContent); no participant data ever reaches this page.
function show(kind, title, msg = "", ref = "") {
  $("box").className = "box" + (kind ? " " + kind : "");
  $("title").textContent = title; $("msg").textContent = msg; $("ref").textContent = ref;
  hide("ref", !ref); hide("setup", true);
}
function forget() { token = null; try { store && (store.removeItem(KEY), store.removeItem(NAME)); } catch (e) {} $("foot").textContent = ""; }
const buzz = (p) => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

async function relay(ref) {
  show("", "Sending...", "", ref);
  // Network errors and server errors (5xx) are retried up to 5 times: 0.5, 1, 2, 4 and 8 seconds apart.
  for (let i = 0; ; i++) {
    let r = null;
    try { r = await fetch(RELAY_URL, { method: "POST", cache: "no-store", headers: { "Content-Type": "application/json", Authorization: "Bearer " + token }, body: JSON.stringify({ ref }) }); } catch (e) { /* offline */ }
    if (r && r.status < 500) return answer(r, ref);
    if (i >= 5) return show("", "Not sent. Check your connection and scan again.", "", ref);
    await sleep(500 * 2 ** i);
  }
}
async function answer(r, ref) {
  let b = {}; try { b = await r.json(); } catch (e) {}
  if (r.status === 200 && b.ok === true && b.status === "checked_in") {
    buzz([250, 120, 250]);
    return show("dup", "ALREADY CHECKED IN" + (/^\d{2}:\d{2}$/.test(b.at || "") ? " at " + b.at : ""), "Check ID. The gate screen has this participant.", ref);
  }
  if (r.status === 200 && b.ok === true) { buzz(80); return show("sent", "Sent to the gate laptop", "", ref); }
  if (r.status === 401) { forget(); return show("", "This phone is no longer set up. Ask the gate lead for a new code."); }
  if (r.status === 404) return show("", "This QR code is not recognised. Ask the participant for their reference.", "", ref);
  if (r.status === 429) return show("", "Scanned too quickly. Wait a moment.", "", ref);
  show("", "Not sent. Check your connection and scan again.", "", ref);
}

function setup() {
  show("", "Set up this phone", "Type the code shown on the gate laptop (Add scanning phone) and a name for this phone.");
  if (!store) { $("msg").textContent = "This browser cannot keep the setup."; return; }
  hide("setup", false);
  const err = (t) => { $("err").textContent = t; };
  $("setup").onsubmit = async (e) => {
    e.preventDefault();
    const code = $("code").value.replace(/\s/g, ""), name = $("label").value.trim();
    if (!/^\d{6}$/.test(code)) return err("Type the 6-digit code shown on the gate laptop.");
    if (!name) return err("Give this phone a name, for example Gate 1.");
    err(""); $("go").disabled = true;
    let r = null, b = {};
    try { r = await fetch(ENROLL_URL, { method: "POST", cache: "no-store", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code, label: name }) }); b = await r.json().catch(() => ({})); } catch (x) { /* offline */ }
    $("go").disabled = false;
    if (!r) return err("No connection. Check the phone's internet and try again.");
    if (r.ok && b.ok === true && typeof b.token === "string") {
      try { store.setItem(KEY, b.token); store.setItem(NAME, typeof b.label === "string" ? b.label : name); } catch (x) { return err("This browser cannot keep the setup. Open this link in Chrome or Safari."); }
      token = b.token; $("code").value = "";
      $("foot").textContent = "This phone: " + (typeof b.label === "string" ? b.label : name);
      return show("sent", "Phone ready", "Scan a participant's QR code with the Camera app.");
    }
    err(typeof b.error === "string" ? b.error : r.status === 429 ? "Too many attempts. Wait a minute and try again." : "Setup failed. Ask the gate lead for a new code.");
  };
}

const raw = new URLSearchParams(location.search).get("ref");
const ref = parseRef(location.search);
if (token && label) $("foot").textContent = "This phone: " + label;
if (!RELAY_URL || !ENROLL_URL) show("", "Scanner not configured", "Ask the organiser to set RELAY_URL and ENROLL_URL in config.js.");
else if (raw !== null && !token) show("", "This QR code is for gate staff. Show it at the gate.");
else if (raw !== null && !ref) show("", "This QR code is not recognised. Ask the participant for their reference.");
else if (ref) relay(ref);
else if (token) show("", "Phone ready. Scan a participant's QR code with the Camera app.");
else setup();
</script>
</body>
</html>
