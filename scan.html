<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Content Creator Contest scanner</title>
<meta name="robots" content="noindex, nofollow">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-lite.js">
<link rel="modulepreload" href="./core.js">
<link rel="modulepreload" href="./config.js">
<link rel="preload" href="assets/fonts/montserrat-latin-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/brand.css">
<style>
  /* Colours and fonts come from assets/brand.css. */
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--black);color:var(--white);font:500 18px/1.45 var(--font-body);display:grid;place-items:center;padding:20px}
  main{width:100%;max-width:440px;text-align:center}
  .logo{display:block;width:110px;height:auto;margin:0 auto 10px}
  h1{font:800 20px/1.2 var(--font-head);margin:0 0 18px;color:var(--orange)}
  .box{background:var(--white);color:var(--text);border-radius:18px;border-top:4px solid var(--orange);padding:22px;text-align:left}
  .big{font:800 28px/1.15 var(--font-head);margin:0 0 6px;color:var(--black)}
  .ref{font:700 26px/1.1 var(--font-mono);letter-spacing:var(--ref-spacing);margin:10px 0;color:var(--black);overflow-wrap:anywhere}
  .ok{color:var(--ok)} .bad{color:var(--bad)} .muted{color:var(--muted);font-size:16px}
  input,button{font:inherit;width:100%;min-height:52px;padding:13px;border-radius:11px;border:2px solid var(--grey-300);margin:6px 0}
  input{background:var(--white);color:var(--text)}
  input:focus-visible,button:focus-visible{outline:3px solid var(--black);outline-offset:2px;border-color:var(--orange)}
  button{background:var(--orange);color:var(--black);border-color:var(--black);font-weight:700;cursor:pointer}
  .hidden{display:none!important}
</style>
</head>
<body>
<main>
  <img class="logo" src="assets/educata-logo-light.png" alt="educataGhana" width="110" height="37">
  <h1>Content Creator Contest scanner</h1>
  <!-- The login box stays hidden until we KNOW there is no saved session, so a signed-in phone never sees it. -->
  <div class="box hidden" id="login">
    <p style="margin-top:0"><b>Staff sign-in</b> (once per phone)</p>
    <input type="email" id="em" placeholder="Staff email" autocomplete="username">
    <input type="password" id="pw" placeholder="Password" autocomplete="current-password">
    <button id="signin">Sign in</button>
    <p class="bad" id="loginerr"></p>
  </div>
  <div class="box" id="status" aria-live="polite">
    <p class="big" id="msg">Opening scanner...</p>
    <div class="ref" id="ref"></div>
    <p class="muted" id="sub"></p>
  </div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { parseRef } from "./core.js";
import { FIREBASE_CONFIG } from "./config.js";

const $ = (id) => document.getElementById(id);
const ref = parseRef(location.search);
const app = initializeApp(FIREBASE_CONFIG);
const auth = getAuth(app);

// Firestore Lite: a plain one-shot HTTPS write, no streaming connection to set up. Falls back to the full SDK if it cannot load.
const fsPromise = import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-lite.js")
  .catch(() => import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"));

function say(cls, msg, sub, showRef) {
  $("status").classList.remove("hidden"); $("login").classList.add("hidden");
  $("msg").className = "big " + cls; $("msg").textContent = msg;
  $("ref").textContent = showRef ? ref : ""; $("sub").textContent = sub || "";
}
function askLogin(err) { $("status").classList.add("hidden"); $("login").classList.remove("hidden"); $("loginerr").textContent = err || ""; }

$("signin").onclick = async () => { try { $("loginerr").textContent = ""; await signInWithEmailAndPassword(auth, $("em").value.trim(), $("pw").value); } catch (e) { $("loginerr").textContent = "Sign in failed: " + (e.code || e.message); } };

let sent = false;
onAuthStateChanged(auth, async (user) => {
  if (!ref) { say("bad", "Not a valid ticket QR code.", "Ask the guest for their reference or use the gate laptop.", false); return; }
  if (!user) { askLogin(""); return; }
  if (sent) return;
  sent = true;
  say("", "Sending to the gate...", "", true);
  const timer = setTimeout(() => say("bad", "Still trying...", "Weak connection. Stay on this page; do not rescan.", true), 6000);
  try {
    const { getFirestore, addDoc, collection, serverTimestamp } = await fsPromise;
    // One write. The security rules decide whether this account may scan, so no extra role lookups are needed.
    await addDoc(collection(getFirestore(app), "scans"), { ref, at: serverTimestamp(), by: user.email });
    clearTimeout(timer);
    say("ok", "Sent to the gate laptop", "Now point your camera at the next participant's QR code.", true);
  } catch (e) {
    clearTimeout(timer); sent = false;
    if (e.code === "permission-denied") { await signOut(auth).catch(() => {}); askLogin("This account is not allowed to scan. Sign in with a staff account."); }
    else say("bad", "Not sent", (e.code || e.message) + ". Check your connection and scan again.", true);
  }
});
</script>
</body>
</html>
