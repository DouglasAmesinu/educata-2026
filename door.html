<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Educata 2026 gate</title>
<meta name="robots" content="noindex, nofollow">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js">
<style>
  :root{--ink:#1B1535;--paper:#EEEBF5;--muted:#5B5675;--line:#cfc9e0;--bad:#B3261E;--gold:#F2B33D}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font:18px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{background:var(--ink);color:#fff;padding:14px 22px;display:flex;justify-content:space-between;align-items:center}
  header b{font-size:22px} header a{color:var(--gold)}
  main{max-width:900px;margin:0 auto;padding:18px 16px 60px}
  .hidden{display:none!important}
  .card{background:#fff;border:2px solid var(--ink);border-radius:16px;padding:22px;box-shadow:5px 5px 0 var(--ink)}
  input[type=email],input[type=password]{width:100%;font:inherit;padding:12px;border:2px solid var(--line);border-radius:10px;margin:6px 0 10px}
  button{font:inherit;border:2px solid var(--ink);border-radius:12px;background:#fff;padding:12px 18px;cursor:pointer}
  .err{color:var(--bad);font-weight:700}
</style>
</head>
<body>
<header><b>Educata 2026 gate</b><a href="admin.html">Admin page</a></header>
<main>
  <p id="boot" class="hidden">Opening...</p>
  <section id="login" class="card hidden">
    <p style="margin-top:0"><b>Admin sign-in</b></p>
    <input type="email" id="em" placeholder="Admin email" autocomplete="username">
    <input type="password" id="pw" placeholder="Password" autocomplete="current-password">
    <button id="signin">Sign in</button>
    <p class="err" id="loginerr"></p>
  </section>
  <section id="live" class="hidden"><div id="gate"></div></section>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { parseRef } from "./core.js";
import { mountGate } from "./gate.js";
import { FIREBASE_CONFIG } from "./config.js";

const $ = (id) => document.getElementById(id);
const db = getFirestore(initializeApp(FIREBASE_CONFIG));
const auth = getAuth();
let started = false;
$("signin").onclick = async () => { try { $("loginerr").textContent = ""; await signInWithEmailAndPassword(auth, $("em").value.trim(), $("pw").value); } catch (e) { $("loginerr").textContent = "Sign in failed: " + (e.code || e.message); } };
onAuthStateChanged(auth, async (user) => {
  if (!user) { $("login").classList.remove("hidden"); $("live").classList.add("hidden"); return; }
  const a = await getDoc(doc(db, "admins", user.uid)).catch(() => null);
  if (!a || !a.exists()) { $("login").classList.remove("hidden"); $("loginerr").textContent = "This account is not on the admin list."; return; }
  $("login").classList.add("hidden"); $("live").classList.remove("hidden");
  if (started) return; started = true;
  const gate = mountGate($("gate"), { db, user });
  const direct = parseRef(location.search);
  if (direct) gate.lookup(direct, false);
});
</script>
</body>
</html>
