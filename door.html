<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Educata 2026 gate</title>
<meta name="robots" content="noindex, nofollow">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js">
<link rel="preload" href="assets/fonts/montserrat-latin-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/brand.css">
<style>
  /* Colours and fonts come from assets/brand.css. Readable from a metre away. */
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--text);font:500 20px/1.45 var(--font-body)}
  header{background:var(--black);color:var(--white);padding:10px 24px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px 24px;position:sticky;top:0;z-index:5}
  #gatebar{flex:1 1 auto;min-width:0}
  header .gate .bar{background:transparent;padding:0;margin:0;border-radius:0;justify-content:flex-end}
  header .brand{display:flex;align-items:center;gap:18px}
  header img{width:120px;height:auto;display:block}
  header b{font:800 26px/1 var(--font-head);padding-left:18px;border-left:2px solid var(--muted)}
  .foot{margin:40px 0 0;font-size:15px;color:var(--muted)}
  .foot a{color:var(--text);display:inline-flex;align-items:center;min-height:48px}
  /* Narrow screens: two clean rows, logo and title on top, the controls below. */
  @media (max-width:820px){header{padding:8px 16px;gap:6px 16px} header img{width:96px} header b{font-size:22px;padding-left:14px} #gatebar{flex-basis:100%}}
  main{max-width:1100px;margin:0 auto;padding:18px 20px 60px}
  .hidden{display:none!important}
  .card{background:var(--white);border:2px solid var(--black);border-radius:16px;padding:24px;box-shadow:5px 5px 0 var(--black);margin-top:24px}
  input[type=email],input[type=password]{width:100%;font:inherit;min-height:56px;padding:12px 14px;border:2px solid var(--grey-300);border-radius:10px;margin:6px 0 12px;background:var(--white);color:var(--text)}
  button{font:inherit;font-weight:700;min-height:56px;border:2px solid var(--black);border-radius:12px;background:var(--orange);color:var(--black);padding:12px 24px;cursor:pointer}
  button:focus-visible,input:focus-visible{outline:4px solid var(--black);outline-offset:2px}
  .err{color:var(--bad);font-weight:700}
</style>
</head>
<body>
<header><span class="brand"><img src="assets/educata-logo-light.png" alt="educataGhana" width="120" height="41"><b>Gate</b></span><div id="gatebar"></div></header>
<main>
  <p id="boot" class="hidden">Opening...</p>
  <section id="login" class="card hidden">
    <p style="margin-top:0"><b>Admin sign-in</b></p>
    <input type="email" id="em" placeholder="Admin email" autocomplete="username">
    <input type="password" id="pw" placeholder="Password" autocomplete="current-password">
    <button id="signin">Sign in</button>
    <p class="err" id="loginerr"></p>
  </section>
  <section id="live" class="hidden"><div id="gate"></div></section>
  <p class="foot"><a href="admin.html">Admin page</a></p>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { parseRef } from "./core.js";
import { mountGate } from "./gate.js";
import { FIREBASE_CONFIG } from "./config.js";

const $ = (id) => document.getElementById(id);
const db = getFirestore(initializeApp(FIREBASE_CONFIG));
const auth = getAuth();
let started = false;
$("signin").onclick = async () => { try { $("loginerr").textContent = ""; await signInWithEmailAndPassword(auth, $("em").value.trim(), $("pw").value); } catch (e) { $("loginerr").textContent = "Sign in failed: " + (e.code || e.message); } };
onAuthStateChanged(auth, async (user) => {
  if (!user) { $("login").classList.remove("hidden"); $("live").classList.add("hidden"); return; }
  const a = await getDoc(doc(db, "admins", user.uid)).catch(() => null);
  if (!a || !a.exists()) { $("login").classList.remove("hidden"); $("loginerr").textContent = "This account is not on the admin list."; return; }
  $("login").classList.add("hidden"); $("live").classList.remove("hidden");
  if (started) return; started = true;
  const gate = mountGate($("gate"), { db, user, bar: $("gatebar") });
  const direct = parseRef(location.search);
  if (direct) gate.lookup(direct, false);
});
</script>
</body>
</html>
